[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/redact",
    "crates/llm",
    "crates/context",
    "crates/record",
]

[workspace.dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
liquid = "0.26"
regex = "1"
lazy_static = "1.4"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
shellexpand = "3.1.0"
strip-ansi-escapes = "0.2.1"
atty = "0.2"
